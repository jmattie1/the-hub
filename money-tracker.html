<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Money Tracker</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#1f232c; --line:#2a2f3a;
    --text:#f0f2f5; --sub:#9aa3b2; --accent:#3ddc84; --accent2:#ffb020;
    --danger:#ff5c5c; --blue:#4c9aff; --income:#3ddc84; --expense:#ff8a65;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:90px;}
  header{padding:14px 16px 10px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--line);}
  header .top-row{display:flex;align-items:center;}
  header h1{font-size:17px;margin:0;display:flex;align-items:center;gap:6px;}
  .gear{margin-left:auto;background:none;border:none;color:var(--sub);font-size:18px;cursor:pointer;}
  .month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:8px;}
  .month-nav button{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:8px;width:32px;height:32px;font-size:15px;cursor:pointer;}
  .month-nav .month-label{font-weight:600;font-size:15px;min-width:140px;text-align:center;}
  main{max-width:480px;margin:0 auto;padding:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);margin:0 0 10px;}
  .summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .sum-box{background:var(--card2);border-radius:10px;padding:10px;text-align:center;}
  .sum-box .label{font-size:10px;color:var(--sub);text-transform:uppercase;}
  .sum-box .val{font-size:17px;font-weight:700;margin-top:4px;}
  .sum-box.income .val{color:var(--income);}
  .sum-box.expense .val{color:var(--expense);}
  .sum-box.net .val{color:var(--blue);}
  .cat-row{margin-bottom:14px;}
  .cat-row:last-child{margin-bottom:0;}
  .cat-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .cat-head .name{font-weight:600;}
  .cat-head .amt{color:var(--sub);}
  .bar-track{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;background:var(--accent);transition:width .2s;}
  .bar-fill.warn{background:var(--accent2);}
  .bar-fill.over{background:var(--danger);}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:20px 0;}
  .tx-day{margin-bottom:16px;}
  .tx-day .day-label{font-size:11px;color:var(--sub);text-transform:uppercase;margin-bottom:6px;letter-spacing:.04em;}
  .tx-item{display:flex;align-items:center;background:var(--card2);border-radius:10px;padding:10px 12px;margin-bottom:6px;}
  .tx-item .tx-cat{flex:1;}
  .tx-item .tx-cat .name{font-size:14px;font-weight:600;}
  .tx-item .tx-cat .note{font-size:12px;color:var(--sub);}
  .tx-item .tx-amt{font-weight:700;font-size:14px;margin-right:8px;}
  .tx-item .tx-amt.income{color:var(--income);}
  .tx-item .tx-amt.expense{color:var(--expense);}
  .tx-item .del{background:none;border:none;color:var(--sub);font-size:16px;cursor:pointer;padding:4px;}
  .budget-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .budget-row .cname{flex:1;font-size:14px;}
  .budget-row input{width:100px;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;font-size:14px;text-align:right;}
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:20;}
  .tabbar button{flex:1;background:none;border:none;color:var(--sub);padding:10px 0 8px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .tabbar button .ic{font-size:18px;}
  .tabbar button.active{color:var(--accent);}
  .fab{position:fixed;bottom:70px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;font-size:28px;border:none;box-shadow:0 4px 14px rgba(0,0,0,.4);cursor:pointer;z-index:20;line-height:0;}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;align-items:flex-end;justify-content:center;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:20px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;}
  .modal h3{margin-top:0;font-size:16px;}
  .type-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .type-toggle button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--sub);font-weight:600;cursor:pointer;}
  .type-toggle button.sel-expense{background:var(--expense);color:#2a0f00;border-color:var(--expense);}
  .type-toggle button.sel-income{background:var(--income);color:#062012;border-color:var(--income);}
  .field{margin-bottom:12px;}
  .field .flabel{font-size:11px;color:var(--sub);margin-bottom:4px;text-transform:uppercase;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px;font-size:15px;font-family:inherit;
  }
  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .cat-grid button{padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:12px;cursor:pointer;}
  .cat-grid button.sel{background:var(--blue);border-color:var(--blue);color:#fff;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions button{flex:1;padding:13px;border-radius:10px;border:none;font-weight:700;font-size:15px;cursor:pointer;}
  .save-btn{background:var(--accent);color:#062012;}
  .cancel-btn{background:var(--card2);color:var(--text);border:1px solid var(--line);}
  .settings-actions button{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:14px;margin-bottom:10px;cursor:pointer;}
  .settings-actions button.danger{color:var(--danger);border-color:var(--danger);}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="top-row">
    <h1>💰 Money Tracker</h1>
    <button class="gear" onclick="openSettings()">⚙️</button>
  </div>
  <div class="month-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button onclick="changeMonth(1)">›</button>
  </div>
</header>

<main id="mainContent"></main>

<button class="fab" onclick="openAdd()">+</button>

<div class="tabbar">
  <button id="tab-overview" class="active" onclick="switchTab('overview')"><span class="ic">📊</span>Overview</button>
  <button id="tab-transactions" onclick="switchTab('transactions')"><span class="ic">📋</span>Transactions</button>
  <button id="tab-budgets" onclick="switchTab('budgets')"><span class="ic">🎯</span>Budgets</button>
</div>

<div class="toast" id="toast"></div>

<!-- Add transaction modal -->
<div class="modal-bg" id="addModal">
  <div class="modal">
    <h3>Add transaction</h3>
    <div class="type-toggle">
      <button id="typeExpenseBtn" class="sel-expense" onclick="setType('expense')">Expense</button>
      <button id="typeIncomeBtn" onclick="setType('income')">Income</button>
    </div>
    <div class="field">
      <div class="flabel">Amount</div>
      <input type="number" inputmode="decimal" id="txAmount" placeholder="0.00">
    </div>
    <div class="field" id="categoryField">
      <div class="flabel">Category</div>
      <div class="cat-grid" id="catGrid"></div>
    </div>
    <div class="field">
      <div class="flabel">Note (optional)</div>
      <input type="text" id="txNote" placeholder="e.g. coffee with Sam">
    </div>
    <div class="field">
      <div class="flabel">Date</div>
      <input type="date" id="txDate">
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeAdd()">Cancel</button>
      <button class="save-btn" onclick="saveTransaction()">Save</button>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h3>Settings</h3>
    <div class="settings-actions">
      <button onclick="exportCSV()">Export all data as CSV</button>
      <button class="danger" onclick="clearAllData()">Clear all data</button>
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeSettings()" style="flex:1;">Close</button>
    </div>
  </div>
</div>

<script>
const CATEGORIES = ["Food & Drink","Groceries","Transport","Housing","Bills","Shopping","Entertainment","Health","Subscriptions","Other"];
const TX_KEY = 'mt_transactions';
const BUDGET_KEY = 'mt_budgets';

let transactions = JSON.parse(localStorage.getItem(TX_KEY) || '[]');
let budgets = JSON.parse(localStorage.getItem(BUDGET_KEY) || '{}');
let viewDate = new Date();
viewDate.setDate(1);
let currentTab = 'overview';
let addType = 'expense';
let addCategory = CATEGORIES[0];

function saveState(){
  localStorage.setItem(TX_KEY, JSON.stringify(transactions));
  localStorage.setItem(BUDGET_KEY, JSON.stringify(budgets));
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

function fmt(n){
  return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

function changeMonth(delta){
  viewDate.setMonth(viewDate.getMonth()+delta);
  render();
}

function switchTab(tab){
  currentTab = tab;
  ['overview','transactions','budgets'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
  });
  render();
}

function getMonthTx(){
  const mk = monthKey(viewDate);
  return transactions.filter(t => t.date.slice(0,7) === mk);
}

function render(){
  document.getElementById('monthLabel').textContent = viewDate.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  if(currentTab === 'overview') renderOverview();
  else if(currentTab === 'transactions') renderTransactions();
  else renderBudgets();
}

function renderOverview(){
  const monthTx = getMonthTx();
  const income = monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const net = income - expense;

  let catHtml = '';
  const catsWithBudget = CATEGORIES.filter(c => budgets[c] && budgets[c] > 0);
  if(catsWithBudget.length === 0){
    catHtml = '<div class="empty">No budgets set yet. Go to the Budgets tab to set spending limits per category.</div>';
  } else {
    catHtml = catsWithBudget.map(c=>{
      const spent = monthTx.filter(t=>t.type==='expense' && t.category===c).reduce((s,t)=>s+t.amount,0);
      const budget = budgets[c];
      const pct = Math.min(100, (spent/budget)*100);
      let cls = '';
      if(pct >= 100) cls = 'over'; else if(pct >= 80) cls = 'warn';
      return `<div class="cat-row">
        <div class="cat-head"><span class="name">${c}</span><span class="amt">$${fmt(spent)} / $${fmt(budget)}</span></div>
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');
  }

  document.getElementById('mainContent').innerHTML = `
    <div class="card">
      <h2>This month</h2>
      <div class="summary-grid">
        <div class="sum-box income"><div class="label">Income</div><div class="val">$${fmt(income)}</div></div>
        <div class="sum-box expense"><div class="label">Spent</div><div class="val">$${fmt(expense)}</div></div>
        <div class="sum-box net"><div class="label">Net</div><div class="val">$${fmt(net)}</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Budgets</h2>
      ${catHtml}
    </div>
  `;
}

function renderTransactions(){
  const monthTx = [...getMonthTx()].sort((a,b)=> b.date.localeCompare(a.date) || b.id - a.id);
  if(monthTx.length === 0){
    document.getElementById('mainContent').innerHTML = '<div class="card"><div class="empty">No transactions this month. Tap + to add one.</div></div>';
    return;
  }
  const byDay = {};
  monthTx.forEach(t=>{
    (byDay[t.date] = byDay[t.date] || []).push(t);
  });
  const days = Object.keys(byDay).sort().reverse();
  const html = days.map(day=>{
    const items = byDay[day].map(t=>`
      <div class="tx-item">
        <div class="tx-cat">
          <div class="name">${t.category}</div>
          ${t.note ? `<div class="note">${escapeHtml(t.note)}</div>` : ''}
        </div>
        <div class="tx-amt ${t.type}">${t.type==='income'?'+':'-'}$${fmt(t.amount)}</div>
        <button class="del" onclick="deleteTx(${t.id})">✕</button>
      </div>
    `).join('');
    const label = new Date(day+'T00:00:00').toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
    return `<div class="tx-day"><div class="day-label">${label}</div>${items}</div>`;
  }).join('');
  document.getElementById('mainContent').innerHTML = `<div class="card">${html}</div>`;
}

function renderBudgets(){
  const html = CATEGORIES.map(c=>`
    <div class="budget-row">
      <div class="cname">${c}</div>
      <input type="number" inputmode="decimal" value="${budgets[c]||''}" placeholder="0" onchange="setBudget('${c}', this.value)">
    </div>
  `).join('');
  document.getElementById('mainContent').innerHTML = `
    <div class="card">
      <h2>Monthly budget per category</h2>
      ${html}
      <div class="empty" style="text-align:left;padding-top:6px;">Set a monthly limit for any category you want tracked on the Overview tab. Leave blank to skip.</div>
    </div>
  `;
}

function setBudget(cat, val){
  const n = parseFloat(val);
  if(!isNaN(n) && n > 0) budgets[cat] = n;
  else delete budgets[cat];
  saveState();
}

function deleteTx(id){
  transactions = transactions.filter(t=>t.id !== id);
  saveState();
  render();
  toast('Deleted');
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// --- Add modal ---
function openAdd(){
  addType = 'expense';
  addCategory = CATEGORIES[0];
  document.getElementById('txAmount').value = '';
  document.getElementById('txNote').value = '';
  document.getElementById('txDate').value = new Date().toISOString().slice(0,10);
  renderCatGrid();
  setType('expense');
  document.getElementById('addModal').classList.add('show');
}
function closeAdd(){ document.getElementById('addModal').classList.remove('show'); }

function setType(t){
  addType = t;
  document.getElementById('typeExpenseBtn').className = t==='expense' ? 'sel-expense' : '';
  document.getElementById('typeIncomeBtn').className = t==='income' ? 'sel-income' : '';
  document.getElementById('categoryField').style.display = t==='expense' ? 'block' : 'none';
}

function renderCatGrid(){
  document.getElementById('catGrid').innerHTML = CATEGORIES.map(c=>
    `<button class="${c===addCategory?'sel':''}" onclick="selCategory('${c}')">${c}</button>`
  ).join('');
}
function selCategory(c){
  addCategory = c;
  renderCatGrid();
}

function saveTransaction(){
  const amount = parseFloat(document.getElementById('txAmount').value);
  if(!amount || amount <= 0){ toast('Enter a valid amount'); return; }
  const date = document.getElementById('txDate').value || new Date().toISOString().slice(0,10);
  const note = document.getElementById('txNote').value.trim();
  const category = addType === 'income' ? 'Income' : addCategory;
  transactions.push({ id: Date.now(), type: addType, category, amount, note, date });
  saveState();
  closeAdd();
  viewDate = new Date(date+'T00:00:00'); viewDate.setDate(1);
  render();
  toast('Saved');
}

// --- Settings ---
function openSettings(){ document.getElementById('settingsModal').classList.add('show'); }
function closeSettings(){ document.getElementById('settingsModal').classList.remove('show'); }

function exportCSV(){
  const rows = [['Date','Type','Category','Amount','Note']];
  [...transactions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
    rows.push([t.date, t.type, t.category, t.amount, (t.note||'').replace(/,/g,';')]);
  });
  const csv = rows.map(r=>r.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'money-tracker-export.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('Exported');
}

function clearAllData(){
  if(!confirm('Delete all transactions and budgets? This cannot be undone.')) return;
  transactions = [];
  budgets = {};
  saveState();
  closeSettings();
  render();
  toast('All data cleared');
}

render();
</script>
</body>
</html>
